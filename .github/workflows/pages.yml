name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages-status:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          case "${status}" in
            200)
              echo "enabled=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "enabled=false" >> "${GITHUB_OUTPUT}"
              echo "Pages is not enabled; deployment is skipped."
              ;;
            *)
              echo "Unexpected Pages API response: ${status}" >&2
              exit 1
              ;;
          esac

  build:
    runs-on: ubuntu-24.04
    env:
      VITE_SOFTWARE_REVISION: ${{ github.sha }}
    needs: pages-status
    if: needs.pages-status.outputs.enabled == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm --filter @everything-rings/web exec vite build --base=/EVERYTHING-RINGS/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
