name: realimpact-layout

on:
  pull_request:
    paths:
      - ".github/workflows/realimpact-layout.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect archive layout
        env:
          URL: https://downloads.cs.stanford.edu/viscam/RealImpact/64_CeramicMug.zip
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import struct
          import urllib.request

          url = os.environ["URL"]
          request = urllib.request.Request(url, method="HEAD")
          with urllib.request.urlopen(request, timeout=60) as response:
              size = int(response.headers["Content-Length"])

          tail_size = min(size, 4 * 1024 * 1024)
          start = size - tail_size
          request = urllib.request.Request(url, headers={"Range": f"bytes={start}-{size - 1}"})
          with urllib.request.urlopen(request, timeout=120) as response:
              tail = response.read()

          eocd = tail.rfind(b"PK\x05\x06")
          if eocd < 0:
              raise SystemExit("EOCD not found")
          _, _, _, _, _, cd_size, cd_offset, _ = struct.unpack_from("<4s4H2LH", tail, eocd)
          relative = cd_offset - start
          if relative >= 0:
              directory = tail[relative:relative + cd_size]
          else:
              request = urllib.request.Request(
                  url,
                  headers={"Range": f"bytes={cd_offset}-{cd_offset + cd_size - 1}"},
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  directory = response.read()

          offset = 0
          names = []
          while offset + 46 <= len(directory) and directory[offset:offset + 4] == b"PK\x01\x02":
              fields = struct.unpack_from("<4s6H3L5H2L", directory, offset)
              name_length = fields[10]
              extra_length = fields[11]
              comment_length = fields[12]
              start_name = offset + 46
              name = directory[start_name:start_name + name_length].decode("utf-8", "replace")
              names.append(name)
              offset += 46 + name_length + extra_length + comment_length

          print(f"archive_bytes={size}")
          print(f"entries={len(names)}")
          for name in names[:300]:
              print(name)
          PY
