name: adversarial-inputs

on:
  push:
    branches: [validation/adversarial-inputs]

permissions:
  contents: read

jobs:
  parser-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @everything-rings/validation exec vitest run test/adversarial-fuzz.test.ts

  dependency-audit-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependency graph for high/critical advisories
        run: pnpm audit --prod --audit-level high

  dependency-audit-full:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Audit full dependency graph for high/critical advisories
        run: pnpm audit --audit-level high
