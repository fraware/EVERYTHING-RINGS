name: digital-twin-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/digital-twin-qualification.yml"
      - "packages/acquisition/**"
      - "packages/dsp/**"
      - "packages/fingerprint/**"
      - "packages/instrument/**"
      - "packages/synth/**"
      - "packages/validation/**"
      - "apps/web/**"
      - "scripts/**"
      - "docs/DIGITAL_TWIN_QUALIFICATION.md"

permissions:
  contents: read

concurrency:
  group: digital-twin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_SOFTWARE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test including digital twins
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Browser qualification
        run: bash scripts/browser-smoke.sh
      - name: Emit qualification report
        run: |
          cat > /tmp/everything-rings-digital-twin-qualification.json <<EOF
          {
            "schemaVersion": 1,
            "qualificationContractVersion": "digital-twin-qualification-2",
            "softwareRevision": "${VITE_SOFTWARE_REVISION}",
            "workflowRunId": "github-run:${{ github.run_id }}",
            "releaseGateEquivalent": false,
            "physicalMicrophonePathTested": false,
            "physicalObjectTested": false,
            "layers": [
              "frozen-dependency-install",
              "typecheck",
              "unit-tests",
              "digital-twin-acoustic-stress",
              "canonical-review-governance",
              "build",
              "browser-e2e"
            ],
            "claim": "software qualification under deterministic synthetic acoustic inputs only"
          }
          EOF
          cat /tmp/everything-rings-digital-twin-qualification.json
      - name: Upload qualification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digital-twin-qualification-${{ env.VITE_SOFTWARE_REVISION }}
          path: /tmp/everything-rings-digital-twin-qualification.json
          if-no-files-found: error
