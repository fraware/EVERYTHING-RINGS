name: migrate-evidence-v5

on:
  push:
    branches: [validation/evidence-software-provenance]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      VITE_SOFTWARE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: validation/evidence-software-provenance
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply evidence provenance migration
        run: |
          set -euo pipefail
          python scripts/migrate-validation-v5.py
          git diff --check
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Browser smoke
        run: bash scripts/browser-smoke.sh
      - name: Commit verified migration
        run: |
          set -euo pipefail
          git rm scripts/migrate-validation-v5.py .github/workflows/migrate-evidence-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Bind validation evidence to software revision'
          git push origin HEAD:validation/evidence-software-provenance
