name: hosted-v8-qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/hosted-v8-qualification.yml"

permissions:
  contents: read

concurrency:
  group: hosted-v8-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_URL: https://fraware.github.io/EVERYTHING-RINGS
      AUTHORIZED_REVISION: 717a4c15a3b15e73c5883f34b86897c03ff70829
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Locate Chromium
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$BROWSER" ]]; then
            echo "No Chromium-compatible browser found" >&2
            exit 1
          fi
          echo "BROWSER=$BROWSER" >> "$GITHUB_ENV"
      - name: Verify live revision and empirical routes
        run: |
          set -euo pipefail
          check_route() {
            local path="$1"
            local expected="$2"
            local name="$3"
            local output="/tmp/everything-rings-hosted-${name}.html"
            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=4000 \
              --dump-dom "${BASE_URL}${path}" >"$output" 2>"/tmp/everything-rings-hosted-${name}.browser.log"
            if ! grep -Fq "$expected" "$output"; then
              echo "Hosted route check failed for ${path}; expected: ${expected}" >&2
              cat "$output" >&2
              cat "/tmp/everything-rings-hosted-${name}.browser.log" >&2
              exit 1
            fi
          }
          check_route "/" "Hit anything." "consumer"
          check_route "/?lab=1" "Acoustic analysis lab" "lab"
          grep -Fq "software revision ${AUTHORIZED_REVISION}" /tmp/everything-rings-hosted-lab.html
          check_route "/?campaign-author=1" "Freeze the experiment before the first strike." "campaign-author"
          check_route "/?campaign=1" "Precommitted physical collection" "campaign"
          check_route "/?release=1" "Empirical release gates" "release"
          check_route "/?gate-b=1" "Post-collection blinded reconstruction" "gate-b"
          check_route "/?gate-c=1" "Post-Gate-B playable identity" "gate-c"
      - name: Exercise hosted acquisition and lifecycle journeys
        run: |
          set -euo pipefail
          BROWSER="$BROWSER" BASE_URL="$BASE_URL" node scripts/consumer-e2e.mjs
          BROWSER="$BROWSER" BASE_URL="$BASE_URL" node scripts/consumer-history-e2e.mjs
          BROWSER="$BROWSER" BASE_URL="$BASE_URL" node scripts/acoustic-capsule-e2e.mjs
          BROWSER="$BROWSER" BASE_URL="$BASE_URL" node scripts/session-lifecycle-e2e.mjs
          BROWSER="$BROWSER" BASE_URL="$BASE_URL" node scripts/permission-e2e.mjs
          BROWSER="$BROWSER" BASE_URL="$BASE_URL" node scripts/mobile-surfaces-e2e.mjs
      - name: Exercise hosted post-collection review without microphone
        run: |
          set -euo pipefail
          BROWSER="$BROWSER" BASE_URL="$BASE_URL" VITE_SOFTWARE_REVISION="$AUTHORIZED_REVISION" node scripts/post-collection-review-e2e.mjs
      - name: Emit hosted qualification record
        run: |
          cat > /tmp/everything-rings-hosted-v8-qualification.json <<EOF
          {
            "schemaVersion": 1,
            "qualificationContractVersion": "hosted-v8-qualification-1",
            "authorizedSoftwareRevision": "${AUTHORIZED_REVISION}",
            "hostedOrigin": "${BASE_URL}/",
            "workflowRunId": "github-run:${{ github.run_id }}",
            "physicalMicrophoneTransducerTested": false,
            "physicalCampaignEvidenceProduced": false,
            "claim": "served v8 revision, browser acquisition/lifecycle, route, and zero-microphone post-collection review qualification under synthetic/fake-media CI only"
          }
          EOF
          cat /tmp/everything-rings-hosted-v8-qualification.json
      - name: Upload hosted qualification record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-v8-qualification-${{ env.AUTHORIZED_REVISION }}
          path: /tmp/everything-rings-hosted-v8-qualification.json
          if-no-files-found: error
