name: release-metric-names

on:
  push:
    branches: [release-validation]

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-validation
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Correct release metric semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          types = Path('packages/validation/src/types.ts')
          text = types.read_text()
          assert text.count('readonly passingObjectCount: number;') == 3
          text = text.replace('readonly passingObjectCount: number;', 'readonly passingSessionCount: number;', 1)
          text = text.replace('readonly passingObjectCount: number;', 'readonly passingSpecimenCount: number;')
          assert text.count('minimumDistinctObjects') == 1
          text = text.replace('minimumDistinctObjects', 'minimumDistinctSpecimens')
          types.write_text(text)

          evaluate = Path('packages/validation/src/evaluate.ts')
          text = evaluate.read_text()
          assert text.count('passingObjectCount: passing.length,') == 3
          text = text.replace('passingObjectCount: passing.length,', 'passingSessionCount: passing.length,', 1)
          text = text.replace('passingObjectCount: passing.length,', 'passingSpecimenCount: passing.length,')
          assert text.count('minimumDistinctObjects') == 3
          text = text.replace('minimumDistinctObjects', 'minimumDistinctSpecimens')
          evaluate.write_text(text)

          release = Path('apps/web/src/ReleaseApp.tsx')
          text = release.read_text()
          assert text.count('passingObjectCount') == 2
          text = text.replace('passingObjectCount', 'passingSpecimenCount')
          text = text.replace('/ 4 required passing objects', '/ 4 required passing specimens')
          text = text.replace('/ 4 objects ·', '/ 4 specimens ·')
          release.write_text(text)

          test = Path('packages/validation/test/gate-c-coverage.test.ts')
          text = test.read_text()
          assert text.count('passingObjectCount') == 1
          test.write_text(text.replace('passingObjectCount', 'passingSpecimenCount'))
          PY
          ! grep -R -n -E 'passingObjectCount|minimumDistinctObjects' apps/web packages/validation
          git diff --check
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Browser smoke
        run: bash scripts/browser-smoke.sh
      - name: Commit verified naming fix
        run: |
          set -euo pipefail
          git rm .github/workflows/release-metric-names.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use specimen-accurate release metrics'
          git push origin HEAD:release-validation
