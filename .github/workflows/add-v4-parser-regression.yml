name: add-v4-parser-regression

on:
  push:
    branches: [validation/evidence-software-provenance]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: validation/evidence-software-provenance
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Add exact superseded-schema assertion
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/validation/test/evaluate.test.ts')
          text = path.read_text()
          old = '    expect(parseValidationEvidence({ ...bundle, softwareRevision: "deadbeef" }).ok).toBe(false);\n    expect(parseValidationEvidence({ schemaVersion: 5, evidenceContractVersion: "validation-evidence-4" }).ok).toBe(false);'
          new = '    expect(parseValidationEvidence({ ...bundle, softwareRevision: "deadbeef" }).ok).toBe(false);\n    expect(parseValidationEvidence({ schemaVersion: 4, evidenceContractVersion: "validation-evidence-4" }).ok).toBe(false);\n    expect(parseValidationEvidence({ schemaVersion: 5, evidenceContractVersion: "validation-evidence-4" }).ok).toBe(false);'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Validation tests
        run: pnpm --filter @everything-rings/validation test
      - name: Commit regression assertion
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/validation/test/evaluate.test.ts
          git diff --cached --check
          git commit -m 'Test rejection of schema v4 evidence'
          git push origin HEAD:validation/evidence-software-provenance
