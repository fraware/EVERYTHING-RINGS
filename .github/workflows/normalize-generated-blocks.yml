name: normalize-generated-blocks

on:
  push:
    branches: [release-validation]

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-validation
      - name: Normalize exact generated blocks
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_between(path: Path, start_marker: str, end_marker: str, lines: list[str]) -> None:
              text = path.read_text()
              assert text.count(start_marker) == 1, (path, text.count(start_marker))
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              replacement = "\n".join(lines) + "\n\n"
              path.write_text(text[:start] + replacement + text[end:])

          hook = Path('apps/web/src/useStrikeSession.ts')
          replace_between(
              hook,
              '  async function prepareInstrument(nextFingerprint: AcousticFingerprintV1): Promise<void> {\n',
              '  function disposeResources(): void {\n',
              [
                  '  async function prepareInstrument(nextFingerprint: AcousticFingerprintV1): Promise<void> {',
                  '    const generation = instrumentGeneration.current;',
                  '    setInstrumentReady(false);',
                  '    setInstrumentFailure(undefined);',
                  '    try {',
                  '      const node = await ensureInstrument();',
                  '      if (node === undefined || generation !== instrumentGeneration.current) return;',
                  '      const message: ModalInstrumentWorkletMessage = {',
                  '        type: "SET_FINGERPRINT",',
                  '        fingerprint: nextFingerprint,',
                  '      };',
                  '      node.port.postMessage(message);',
                  '      setInstrumentReady(true);',
                  '    } catch (error) {',
                  '      if (generation !== instrumentGeneration.current) return;',
                  '      setInstrumentFailure(error instanceof Error ? error.message : String(error));',
                  '      setInstrumentReady(false);',
                  '    }',
                  '  }',
              ],
          )

          evaluator = Path('packages/validation/src/evaluate.ts')
          replace_between(
              evaluator,
              '  const selectedTargetsByLabel = new Map(\n',
              '  const reasons: string[] = [];\n',
              [
                  '  const selectedTargetsByLabel = new Map(',
                  '    eligibleObjects.map((object) => [normalizedLabel(object.objectLabel), object.selectedTarget] as const),',
                  '  );',
                  '  const eligibleReviews = dedupeGateCReviews(reviews.filter((review) => {',
                  '    const selectedTarget = selectedTargetsByLabel.get(normalizedLabel(review.objectLabel));',
                  '    return selectedTarget !== undefined',
                  '      && selectedTarget !== null',
                  '      && targetKey(review) === targetKey(selectedTarget);',
                  '  }));',
                  '  const eligibleDeviceClassById = new Map<string, GateCReview["deviceClass"]>();',
                  '  const conflictingDeviceIds = new Set<string>();',
                  '  for (const review of eligibleReviews) {',
                  '    const deviceId = normalizedIdentifier(review.deviceId);',
                  '    if (deviceId.length === 0) continue;',
                  '    const previousClass = eligibleDeviceClassById.get(deviceId);',
                  '    if (previousClass !== undefined && previousClass !== review.deviceClass) conflictingDeviceIds.add(deviceId);',
                  '    else eligibleDeviceClassById.set(deviceId, review.deviceClass);',
                  '  }',
                  '',
                  '  const passing = objects.filter((object) => object.passed);',
                  '  const passingLabels = new Set(passing.map((object) => normalizedLabel(object.objectLabel)));',
                  '  const passingReviews = eligibleReviews.filter((review) => passingLabels.has(normalizedLabel(review.objectLabel)));',
                  '  const passingDeviceClassById = new Map<string, GateCReview["deviceClass"]>();',
                  '  for (const review of passingReviews) {',
                  '    const deviceId = normalizedIdentifier(review.deviceId);',
                  '    if (deviceId.length > 0 && !passingDeviceClassById.has(deviceId)) {',
                  '      passingDeviceClassById.set(deviceId, review.deviceClass);',
                  '    }',
                  '  }',
                  '  const distinctDeviceCount = passingDeviceClassById.size;',
                  '  const hasMobileDevice = [...passingDeviceClassById.values()].includes("mobile");',
                  '  const reviewedObjectCount = objects.filter((object) => object.reviewCount > 0).length;',
              ],
          )
          PY
          git diff --check
          git rm .github/workflows/normalize-generated-blocks.yml
      - name: Commit exact normalization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Normalize validation implementation formatting'
          git push origin HEAD:release-validation
