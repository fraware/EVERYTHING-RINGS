name: noise-floor-fix-e2e

on:
  push:
    branches:
      - stress/noise-floor-fix-e2e-2026-08-15

permissions:
  contents: read

jobs:
  chromium-fake-microphone:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_SOFTWARE_REVISION: 76732edaa78e2b21293dbce65d1625fc43531e06
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate deterministic three-mode fake microphone WAV
        shell: bash
        run: |
          python - <<'PY'
          import math, random, struct, wave
          rate = 48000
          seconds = 5.0
          onset = 0.85
          rng = random.Random(20260815)
          modes = [(440.0, 0.55, 1.20), (997.0, 0.31, 0.70), (2413.0, 0.17, 0.38)]
          path = '/tmp/everything-rings-fake-impact.wav'
          with wave.open(path, 'wb') as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              frames = bytearray()
              for i in range(round(rate * seconds)):
                  t = i / rate
                  value = (rng.random() * 2 - 1) * 0.00025
                  if t >= onset:
                      dt = t - onset
                      value += sum(a * math.exp(-dt / tau) * math.sin(2 * math.pi * f * dt) for f, a, tau in modes)
                  value = max(-0.92, min(0.92, value))
                  frames += struct.pack('<h', round(value * 32767))
              out.writeframes(frames)
          PY
      - name: Install isolated Chromium harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/everything-rings-noise-floor-e2e
          cd /tmp/everything-rings-noise-floor-e2e
          npm init -y >/dev/null
          npm install --save-exact playwright@1.62.0
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Verify only measurement-supported modes survive
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @everything-rings/web exec vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/everything-rings-noise-floor-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 0.25
          done
          cat >/tmp/everything-rings-noise-floor-e2e/e2e.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const revision = '76732edaa78e2b21293dbce65d1625fc43531e06';
          const origin = 'http://127.0.0.1:4173';
          const browser = await chromium.launch({
            headless: true,
            args: [
              '--use-fake-ui-for-media-stream',
              '--use-fake-device-for-media-stream',
              '--use-file-for-fake-audio-capture=/tmp/everything-rings-fake-impact.wav',
              '--autoplay-policy=no-user-gesture-required',
            ],
          });
          const context = await browser.newContext({ acceptDownloads: true });
          await context.grantPermissions(['microphone'], { origin });
          const page = await context.newPage();
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(String(error)));
          await page.goto(`${origin}/?lab=1`, { waitUntil: 'networkidle' });

          await page.getByLabel('specimen ID').fill('noise-floor-regression');
          await page.getByLabel('object').fill('three-mode synthetic impact');
          await page.getByLabel('material').selectOption('metal');
          await page.getByLabel('microphone distance').fill('20');
          await page.getByLabel('striker').fill('deterministic fake microphone waveform');
          await page.getByLabel('strike location').fill('synthetic onset');
          await page.getByLabel('support condition').fill('CI positive control');
          await page.getByRole('button', { name: 'ARM MICROPHONE' }).click();
          await page.locator('.status-success').waitFor({ state: 'visible', timeout: 20000 });

          const downloadPromise = page.waitForEvent('download');
          await page.getByRole('button', { name: 'EXPORT EVIDENCE' }).click();
          const download = await downloadPromise;
          const evidencePath = '/tmp/everything-rings-noise-floor-e2e/evidence.json';
          await download.saveAs(evidencePath);
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          const fingerprint = evidence.attempts?.[0]?.analysis?.fingerprint;
          if (!fingerprint) throw new Error('missing successful exported fingerprint');
          if (evidence.softwareRevision !== revision) throw new Error(`wrong revision ${evidence.softwareRevision}`);
          if (fingerprint.modes.length !== 3) throw new Error(`expected exactly 3 measurement-supported modes, got ${fingerprint.modes.length}`);
          const frequencies = fingerprint.modes.map((mode) => mode.frequencyHz);
          for (const expected of [440, 997, 2413]) {
            if (!frequencies.some((actual) => Math.abs(actual - expected) <= Math.max(5, expected * 0.01))) {
              throw new Error(`expected resonance near ${expected} Hz; observed ${JSON.stringify(frequencies)}`);
            }
          }
          if (fingerprint.modes.some((mode) => mode.relativeAmplitude < 0.001)) {
            throw new Error(`submeasurement-floor mode escaped selection: ${JSON.stringify(fingerprint.modes)}`);
          }
          if (pageErrors.length > 0) throw new Error(`uncaught page errors: ${pageErrors.join(' | ')}`);
          console.log(JSON.stringify({
            frequencies,
            amplitudes: fingerprint.modes.map((mode) => mode.relativeAmplitude),
            decays: fingerprint.modes.map((mode) => mode.decaySeconds),
            quality: evidence.attempts[0].quality,
          }, null, 2));
          await browser.close();
          NODE
          cd /tmp/everything-rings-noise-floor-e2e
          node e2e.mjs | tee /tmp/everything-rings-noise-floor-e2e-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noise-floor-fix-e2e-report
          path: |
            /tmp/everything-rings-noise-floor-e2e-result.json
            /tmp/everything-rings-noise-floor-e2e/evidence.json
          if-no-files-found: warn
