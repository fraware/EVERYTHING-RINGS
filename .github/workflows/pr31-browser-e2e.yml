name: pr31-browser-e2e

on:
  push:
    branches:
      - stress/pr31-browser-e2e-2026-08-15

permissions:
  contents: read

env:
  PRODUCT_REVISION: 556175c7749b8c2ef9e582f1328bcba668ac7f50
  VITE_SOFTWARE_REVISION: 556175c7749b8c2ef9e582f1328bcba668ac7f50

jobs:
  three-mode-positive-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate deterministic three-mode microphone WAV
        shell: bash
        run: |
          python - <<'PY'
          import math, random, struct, wave
          rate = 48000
          seconds = 5.0
          onset = 0.85
          rng = random.Random(20260815)
          modes = [(440.0, 0.55, 1.20), (997.0, 0.31, 0.70), (2413.0, 0.17, 0.38)]
          path = '/tmp/everything-rings-pr31-positive.wav'
          with wave.open(path, 'wb') as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              frames = bytearray()
              for i in range(round(rate * seconds)):
                  t = i / rate
                  value = (rng.random() * 2 - 1) * 0.00025
                  if t >= onset:
                      dt = t - onset
                      value += sum(a * math.exp(-dt / tau) * math.sin(2 * math.pi * f * dt) for f, a, tau in modes)
                  value = max(-0.92, min(0.92, value))
                  frames += struct.pack('<h', round(value * 32767))
              out.writeframes(frames)
          PY
      - name: Install isolated Chromium harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/everything-rings-pr31-e2e
          cd /tmp/everything-rings-pr31-e2e
          npm init -y >/dev/null
          npm install --save-exact playwright@1.62.0
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Exercise microphone through evidence export
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @everything-rings/web exec vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/everything-rings-pr31-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 0.25
          done
          cat >/tmp/everything-rings-pr31-e2e/positive.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const revision = process.env.PRODUCT_REVISION;
          const origin = 'http://127.0.0.1:4173';
          const browser = await chromium.launch({
            headless: true,
            args: [
              '--use-fake-ui-for-media-stream',
              '--use-fake-device-for-media-stream',
              '--use-file-for-fake-audio-capture=/tmp/everything-rings-pr31-positive.wav',
              '--autoplay-policy=no-user-gesture-required',
            ],
          });
          const context = await browser.newContext({ acceptDownloads: true });
          await context.grantPermissions(['microphone'], { origin });
          const page = await context.newPage();
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(String(error)));
          await page.goto(`${origin}/?lab=1`, { waitUntil: 'networkidle' });

          const initialBody = await page.locator('body').innerText();
          if (!initialBody.includes(`software revision ${revision}`)) throw new Error('lab revision stamp mismatch');
          await page.getByLabel('specimen ID').fill('pr31-three-mode-positive');
          await page.getByLabel('object').fill('three-mode synthetic impact');
          await page.getByLabel('material').selectOption('metal');
          await page.getByLabel('microphone distance').fill('20');
          await page.getByLabel('striker').fill('deterministic fake microphone waveform');
          await page.getByLabel('strike location').fill('synthetic onset');
          await page.getByLabel('support condition').fill('PR31 browser positive control');
          await page.getByRole('button', { name: 'ARM MICROPHONE' }).click();
          await page.locator('.status-success').waitFor({ state: 'visible', timeout: 20000 });

          const downloadPromise = page.waitForEvent('download');
          await page.getByRole('button', { name: 'EXPORT EVIDENCE' }).click();
          const download = await downloadPromise;
          const evidencePath = '/tmp/everything-rings-pr31-e2e/evidence.json';
          await download.saveAs(evidencePath);
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          if (evidence.schemaVersion !== 5 || evidence.evidenceContractVersion !== 'validation-evidence-5') throw new Error('wrong evidence schema');
          if (evidence.gateAContractVersion !== 'gate-a-2') throw new Error('wrong Gate A contract');
          if (evidence.softwareRevision !== revision) throw new Error(`wrong software revision ${evidence.softwareRevision}`);
          if (evidence.rawMicrophoneSamplesIncluded !== false) throw new Error('raw PCM invariant violated');
          if (evidence.attemptCount !== 1 || evidence.attempts?.length !== 1) throw new Error('expected one qualified attempt');
          const fingerprint = evidence.attempts?.[0]?.analysis?.fingerprint;
          if (!fingerprint) throw new Error('missing successful fingerprint');
          if (fingerprint.version !== 1 || fingerprint.algorithmVersion !== 'er-dsp-2') throw new Error(`wrong fingerprint version ${JSON.stringify({ version: fingerprint.version, algorithmVersion: fingerprint.algorithmVersion })}`);
          if (fingerprint.modes.length !== 3) throw new Error(`expected exactly 3 measurement-supported modes, got ${fingerprint.modes.length}`);
          if (fingerprint.modes.some((mode) => mode.relativeAmplitude < 0.001)) throw new Error('submeasurement-floor mode escaped selection');
          const frequencies = fingerprint.modes.map((mode) => mode.frequencyHz);
          for (const expected of [440, 997, 2413]) {
            if (!frequencies.some((actual) => Math.abs(actual - expected) <= Math.max(5, expected * 0.01))) {
              throw new Error(`missing resonance near ${expected} Hz; observed ${JSON.stringify(frequencies)}`);
            }
          }
          if (pageErrors.length > 0) throw new Error(`uncaught page errors: ${pageErrors.join(' | ')}`);
          console.log(JSON.stringify({
            revision,
            algorithmVersion: fingerprint.algorithmVersion,
            sampleRate: fingerprint.sampleRate,
            modeCount: fingerprint.modes.length,
            frequencies,
            amplitudes: fingerprint.modes.map((mode) => mode.relativeAmplitude),
            decays: fingerprint.modes.map((mode) => mode.decaySeconds),
            quality: evidence.attempts[0].quality,
          }, null, 2));
          await browser.close();
          NODE
          cd /tmp/everything-rings-pr31-e2e
          node positive.mjs | tee /tmp/everything-rings-pr31-positive.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr31-browser-positive
          path: |
            /tmp/everything-rings-pr31-positive.json
            /tmp/everything-rings-pr31-e2e/evidence.json
          if-no-files-found: warn

  rejection-controls:
    strategy:
      fail-fast: false
      matrix:
        scenario: [multiple, clipping-probe]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate deterministic rejection WAV
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          import math, os, random, struct, wave
          rate = 48000
          seconds = 5.0
          onset = 0.85
          scenario = os.environ['SCENARIO']
          rng = random.Random(20260815)
          path = f'/tmp/everything-rings-{scenario}.wav'
          with wave.open(path, 'wb') as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              frames = bytearray()
              for i in range(round(rate * seconds)):
                  t = i / rate
                  value = (rng.random() * 2 - 1) * 0.0002
                  if scenario == 'clipping-probe' and t >= onset:
                      dt = t - onset
                      if dt < 0.030:
                          value = 1.0 if (i % 2 == 0) else -1.0
                      else:
                          value += 0.35 * math.exp(-dt / 0.7) * math.sin(2 * math.pi * 440 * dt)
                  elif scenario == 'multiple':
                      if t >= onset:
                          dt = t - onset
                          value += 0.24 * math.exp(-dt / 0.35) * math.sin(2 * math.pi * 440 * dt)
                          value += 0.18 * math.exp(-dt / 0.25) * math.sin(2 * math.pi * 997 * dt)
                      second = onset + 0.20
                      if t >= second:
                          dt2 = t - second
                          value += 0.48 * math.exp(-dt2 / 0.35) * math.sin(2 * math.pi * 440 * dt2)
                          value += 0.36 * math.exp(-dt2 / 0.25) * math.sin(2 * math.pi * 997 * dt2)
                  value = max(-1.0, min(1.0, value))
                  frames += struct.pack('<h', round(value * 32767))
              out.writeframes(frames)
          PY
      - name: Install isolated Chromium harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/everything-rings-pr31-rejection
          cd /tmp/everything-rings-pr31-rejection
          npm init -y >/dev/null
          npm install --save-exact playwright@1.62.0
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Verify truthful rejection behavior
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          pnpm --filter @everything-rings/web exec vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/everything-rings-pr31-rejection-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 0.25
          done
          cat >/tmp/everything-rings-pr31-rejection/reject.mjs <<'NODE'
          import { chromium } from 'playwright';
          const scenario = process.env.SCENARIO;
          const origin = 'http://127.0.0.1:4173';
          const browser = await chromium.launch({
            headless: true,
            args: [
              '--use-fake-ui-for-media-stream',
              '--use-fake-device-for-media-stream',
              `--use-file-for-fake-audio-capture=/tmp/everything-rings-${scenario}.wav`,
              '--autoplay-policy=no-user-gesture-required',
            ],
          });
          const context = await browser.newContext();
          await context.grantPermissions(['microphone'], { origin });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', (error) => errors.push(String(error)));
          await page.goto(`${origin}/?lab=1`, { waitUntil: 'networkidle' });
          await page.getByLabel('specimen ID').fill(`pr31-${scenario}`);
          await page.getByLabel('object').fill(`${scenario} rejection control`);
          await page.getByLabel('material').selectOption('metal');
          await page.getByLabel('microphone distance').fill('20');
          await page.getByLabel('striker').fill('deterministic fake microphone waveform');
          await page.getByLabel('strike location').fill('synthetic onset');
          await page.getByLabel('support condition').fill('PR31 browser rejection control');
          await page.getByRole('button', { name: 'ARM MICROPHONE' }).click();
          await page.locator('.status-failure').waitFor({ state: 'visible', timeout: 20000 });
          const body = await page.locator('body').innerText();
          if (body.includes('stable resonances found')) throw new Error(`${scenario}: bad capture reached success state`);
          if (errors.length > 0) throw new Error(`${scenario}: uncaught page errors: ${errors.join(' | ')}`);

          if (scenario === 'multiple') {
            const expected = 'More than one strong impact was detected. Strike the object once.';
            if (!body.includes(expected)) throw new Error(`multiple-impact rejection copy missing. Body: ${body}`);
            console.log(JSON.stringify({ scenario, rejected: true, reason: 'MULTIPLE_IMPACTS' }, null, 2));
          } else {
            const peakMatch = body.match(/peak\s+([0-9.]+)/i);
            const clippedMatch = body.match(/clipped\s+([0-9.]+)%/i);
            if (!peakMatch || !clippedMatch) throw new Error(`could not parse delivered clipping diagnostics. Body: ${body}`);
            const peak = Number.parseFloat(peakMatch[1]);
            const clippedPercent = Number.parseFloat(clippedMatch[1]);
            if (!Number.isFinite(peak) || !Number.isFinite(clippedPercent)) throw new Error('non-finite clipping diagnostics');
            const overloadCopy = body.includes('The strike overloaded the microphone. Move the device farther away and try again.');
            const shouldRejectAsClipped = clippedPercent > 0.1;
            if (shouldRejectAsClipped !== overloadCopy) {
              throw new Error(`clipping diagnosis disagrees with delivered PCM: peak=${peak}, clippedPercent=${clippedPercent}, overloadCopy=${overloadCopy}`);
            }
            console.log(JSON.stringify({
              scenario,
              sourceWasHardClipped: true,
              deliveredPeak: peak,
              deliveredClippedPercent: clippedPercent,
              browserAttenuatedBelowClippingGate: !shouldRejectAsClipped,
              diagnosedClipped: overloadCopy,
            }, null, 2));
          }
          await browser.close();
          NODE
          cd /tmp/everything-rings-pr31-rejection
          node reject.mjs | tee "/tmp/everything-rings-${SCENARIO}-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr31-${{ matrix.scenario }}-report
          path: /tmp/everything-rings-${{ matrix.scenario }}-result.json
          if-no-files-found: warn
