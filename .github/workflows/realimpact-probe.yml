name: realimpact-benchmark

on:
  workflow_dispatch:
    inputs:
      object_name:
        description: RealImpact object archive name
        required: true
        default: 64_CeramicMug
        type: string
      max_measurements:
        description: Maximum separate measurements to analyze
        required: true
        default: "8"
        type: string
  push:
    branches:
      - gate-a-validation
    paths:
      - ".github/workflows/realimpact-probe.yml"
      - "packages/fingerprint/test/realimpact.test.ts"

concurrency:
  group: realimpact-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OBJECT_NAME: ${{ github.event.inputs.object_name || '64_CeramicMug' }}
      MAX_MEASUREMENTS: ${{ github.event.inputs.max_measurements || '8' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download RealImpact object
        run: |
          set -euo pipefail
          mkdir -p .realimpact
          url="https://downloads.cs.stanford.edu/viscam/RealImpact/${OBJECT_NAME}.zip"
          echo "Downloading ${url}"
          df -h .
          curl --fail --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --output ".realimpact/${OBJECT_NAME}.zip" "${url}"
          ls -lh ".realimpact/${OBJECT_NAME}.zip"

      - name: Extract object archive
        run: |
          set -euo pipefail
          unzip -q ".realimpact/${OBJECT_NAME}.zip" -d .realimpact/extracted
          rm ".realimpact/${OBJECT_NAME}.zip"
          find .realimpact/extracted -path '*/preprocessed/deconvolved_0db.npy' -print
          df -h .

      - name: Run external recurrence benchmark
        run: |
          set -euo pipefail
          response_path="$(find .realimpact/extracted -path '*/preprocessed/deconvolved_0db.npy' -print -quit)"
          if [ -z "${response_path}" ]; then
            echo "Could not locate preprocessed/deconvolved_0db.npy" >&2
            exit 1
          fi
          object_dir="$(dirname "$(dirname "${response_path}")")"
          object_dir="$(realpath "${object_dir}")"
          echo "REALIMPACT_DIR=${object_dir}"
          REALIMPACT_DIR="${object_dir}" \
          REALIMPACT_MAX_MEASUREMENTS="${MAX_MEASUREMENTS}" \
          REALIMPACT_REPORT=/tmp/everything-rings-realimpact.json \
          pnpm --filter @everything-rings/fingerprint test:realimpact

      - name: Print external recurrence report
        if: always()
        run: |
          if [ -f /tmp/everything-rings-realimpact.json ]; then
            cat /tmp/everything-rings-realimpact.json
          fi

      - name: Upload external recurrence report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: realimpact-recurrence-${{ env.OBJECT_NAME }}
          path: /tmp/everything-rings-realimpact.json
          if-no-files-found: warn
