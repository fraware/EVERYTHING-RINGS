name: apply-audio-recovery

on:
  push:
    branches: [post-freeze-audio-recovery]
    paths: [.github/workflows/apply-audio-recovery.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: post-freeze-audio-recovery
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded integration
        run: |
          python - <<'PY'
          from pathlib import Path

          hook = Path('apps/web/src/useStrikeSession.ts')
          text = hook.read_text()
          replacements = [
            (
              'import instrumentWorkletUrl from "./instrument-processor.ts?worker&url";\n',
              'import instrumentWorkletUrl from "./instrument-processor.ts?worker&url";\nimport { ensureAudioContextRunning } from "./audioContext";\n',
            ),
            (
              '  const [instrumentFailure, setInstrumentFailure] = useState<string>();\n  const [audioTiming, setAudioTiming] = useState<RealtimeAudioTiming>();\n',
              '  const [instrumentFailure, setInstrumentFailure] = useState<string>();\n  const [playbackFailure, setPlaybackFailure] = useState<string>();\n  const [audioTiming, setAudioTiming] = useState<RealtimeAudioTiming>();\n',
            ),
            (
              '      setInstrumentFailure(undefined);\n      setAudioTiming(undefined);\n',
              '      setInstrumentFailure(undefined);\n      setPlaybackFailure(undefined);\n      setAudioTiming(undefined);\n',
            ),
            (
              '    setInstrumentFailure(undefined);\n    pendingInstrumentEvents.current.clear();\n',
              '    setInstrumentFailure(undefined);\n    setPlaybackFailure(undefined);\n    pendingInstrumentEvents.current.clear();\n',
            ),
            (
              '    setInstrumentFailure(undefined);\n    if (alreadyIdle) {\n',
              '    setInstrumentFailure(undefined);\n    setPlaybackFailure(undefined);\n    if (alreadyIdle) {\n',
            ),
            (
              '  function play(samples: Float32Array, sampleRate: number): void {\n    const context = resources.current?.context;\n    if (context === undefined) return;\n    playSamples(context, samples, sampleRate);\n  }\n\n  function noteOn(midiNote: number, velocity = 1): boolean {\n    const current = resources.current;\n    if (!instrumentReady || current?.instrument === undefined) return false;\n    const eventId = nextInstrumentEventId.current;\n    nextInstrumentEventId.current += 1;\n    pendingInstrumentEvents.current.set(eventId, current.context.currentTime);\n    const message: ModalInstrumentWorkletMessage = { type: "NOTE_ON", midiNote, velocity, eventId };\n    current.instrument.port.postMessage(message);\n    return true;\n  }\n',
              '  async function play(samples: Float32Array, sampleRate: number): Promise<boolean> {\n    const context = resources.current?.context;\n    if (context === undefined) return false;\n    if (!await ensureAudioContextRunning(context)) {\n      setPlaybackFailure("Audio is paused by the browser. Tap again to resume playback.");\n      return false;\n    }\n    setPlaybackFailure(undefined);\n    playSamples(context, samples, sampleRate);\n    return true;\n  }\n\n  async function noteOn(midiNote: number, velocity = 1): Promise<boolean> {\n    const current = resources.current;\n    if (!instrumentReady || current?.instrument === undefined) return false;\n    if (!await ensureAudioContextRunning(current.context)) {\n      setPlaybackFailure("Audio is paused by the browser. Tap a key again to resume playback.");\n      return false;\n    }\n    setPlaybackFailure(undefined);\n    const eventId = nextInstrumentEventId.current;\n    nextInstrumentEventId.current += 1;\n    pendingInstrumentEvents.current.set(eventId, current.context.currentTime);\n    const message: ModalInstrumentWorkletMessage = { type: "NOTE_ON", midiNote, velocity, eventId };\n    current.instrument.port.postMessage(message);\n    return true;\n  }\n',
            ),
            (
              '    instrumentFailure,\n    audioTiming,\n',
              '    instrumentFailure,\n    playbackFailure,\n    audioTiming,\n',
            ),
          ]
          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'useStrikeSession replacement count {count} for {old[:60]!r}')
            text = text.replace(old, new)
          hook.write_text(text)

          consumer = Path('apps/web/src/ConsumerApp.tsx')
          text = consumer.read_text()
          old = '    {showKeyboard && session.instrumentReady ? <section'
          new = '    {session.playbackFailure !== undefined ? <p className="consumer-audio-error" role="alert">{session.playbackFailure}</p> : null}\n    {showKeyboard && session.instrumentReady ? <section'
          if text.count(old) != 1:
            raise SystemExit(f'ConsumerApp playback alert anchor count {text.count(old)}')
          consumer.write_text(text.replace(old, new))
          PY
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: bash scripts/browser-smoke.sh
      - name: Commit verified changes
        run: |
          rm .github/workflows/apply-audio-recovery.yml
          git add -A
          git diff --cached --check
          git config user.name "repository-maintenance"
          git config user.email "repository-maintenance@users.noreply.github.com"
          git commit -m "Recover suspended audio playback"
          git push origin HEAD:post-freeze-audio-recovery
