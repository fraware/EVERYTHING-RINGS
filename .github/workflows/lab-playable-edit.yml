name: apply-lab-playable-controls

on:
  push:
    branches: [post-freeze-lab-playable-controls]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply lab playable control integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: post-freeze-lab-playable-controls
      - name: Apply exact LabApp edit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/LabApp.tsx')
          text = path.read_text()

          old_import = 'import { GateReviewPanel } from "./GateReviewPanel";\nimport { useStrikeSession } from "./useStrikeSession";'
          new_import = 'import { GateReviewPanel } from "./GateReviewPanel";\nimport { PlayableKeyboard } from "./PlayableKeyboard";\nimport { useStrikeSession } from "./useStrikeSession";'
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import)

          old_notes = '''const KEYBOARD_NOTES = [
            { midi: 60, label: "C4" }, { midi: 61, label: "C♯4" }, { midi: 62, label: "D4" },
            { midi: 63, label: "D♯4" }, { midi: 64, label: "E4" }, { midi: 65, label: "F4" },
            { midi: 66, label: "F♯4" }, { midi: 67, label: "G4" }, { midi: 68, label: "G♯4" },
            { midi: 69, label: "A4" }, { midi: 70, label: "A♯4" }, { midi: 71, label: "B4" },
            { midi: 72, label: "C5" },
          ] as const;

          '''
          old_notes = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_notes.splitlines()) + '\n'
          assert text.count(old_notes) == 1
          text = text.replace(old_notes, '')

          old_keyboard = '<div className="instrument-lab"><p className="eyebrow">GATE C</p><h3>Realtime playable object</h3><p className="small">{session.instrumentReady ? "Modal voices are rendered continuously in the audio thread. Scheduling delay excludes the browser-reported output path." : session.instrumentFailure !== undefined ? "Realtime playback is unavailable in this browser session." : "Preparing the audio thread…"}</p><div className="keyboard">{KEYBOARD_NOTES.map((note) => <button key={note.midi} disabled={!session.instrumentReady} onPointerDown={() => session.noteOn(note.midi)}>{note.label}</button>)}</div></div>'
          new_keyboard = '''<div className="instrument-lab">
          <p className="eyebrow">GATE C</p>
          <h3>Realtime playable object</h3>
          <p className="small">{session.instrumentReady ? "Modal voices are rendered continuously in the audio thread. Scheduling delay excludes the browser-reported output path." : session.instrumentFailure !== undefined ? "Realtime playback is unavailable in this browser session." : "Preparing the audio thread…"}</p>
          <PlayableKeyboard disabled={!session.instrumentReady} playbackFailure={session.playbackFailure} onNoteOn={session.noteOn} />
        </div>'''
          assert text.count(old_keyboard) == 1
          text = text.replace(old_keyboard, new_keyboard)

          path.write_text(text)
          PY
          git diff --check
      - name: Commit LabApp integration
        run: |
          git config user.name "Matéo H. Petel"
          git config user.email "113530345+fraware@users.noreply.github.com"
          git add apps/web/src/LabApp.tsx
          git commit -m "Use accessible lab playable controls"
          git push origin HEAD:post-freeze-lab-playable-controls
