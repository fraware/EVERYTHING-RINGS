name: consumer-e2e

on:
  push:
    branches: [validation/consumer-e2e]

permissions:
  contents: read

jobs:
  consumer-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_REVISION: 7ae302e8a5af32ebea699100234fedaa8369c2fa
      VITE_SOFTWARE_REVISION: 7ae302e8a5af32ebea699100234fedaa8369c2fa
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7ae302e8a5af32ebea699100234fedaa8369c2fa
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${TARGET_REVISION}"
      - name: Generate deterministic strike
        run: |
          python - <<'PY'
          import math, os, random, wave
          sr = 48_000
          duration = 6.0
          onset = 1.0
          random.seed(0x45524331)
          path = os.path.join(os.environ['RUNNER_TEMP'], 'consumer-loop.wav')
          with wave.open(path, 'wb') as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sr)
              frames = bytearray()
              for i in range(round(sr * duration)):
                  t = i / sr
                  value = random.uniform(-0.00012, 0.00012)
                  if t >= onset:
                      dt = t - onset
                      value += 0.45 * math.exp(-dt / 1.20) * math.cos(2 * math.pi * 440 * dt)
                      value += 0.24 * math.exp(-dt / 0.70) * math.cos(2 * math.pi * 997 * dt)
                      value += 0.12 * math.exp(-dt / 0.38) * math.cos(2 * math.pi * 2413 * dt)
                  value = max(-0.90, min(0.90, value))
                  frames += int(round(value * 32767)).to_bytes(2, 'little', signed=True)
              wav.writeframes(frames)
          print(path)
          PY
      - run: pnpm build
      - name: Install browser driver
        run: |
          mkdir -p "${RUNNER_TEMP}/consumer-e2e"
          cd "${RUNNER_TEMP}/consumer-e2e"
          npm init -y >/dev/null
          npm install --no-save --package-lock=false puppeteer-core@24.31.0
          node -e "const p=require('puppeteer-core/package.json'); if(p.version!=='24.31.0') process.exit(1)"
      - name: Exercise consumer lifecycle
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "${CHROME}"
          pnpm --filter @everything-rings/web exec vite preview --host 127.0.0.1 --port 4173 --strictPort >"${RUNNER_TEMP}/consumer-vite.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          cat >"${RUNNER_TEMP}/consumer-e2e/test.mjs" <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME,
            headless: true,
            args: [
              '--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage',
              '--use-fake-device-for-media-stream', '--use-fake-ui-for-media-stream',
              `--use-file-for-fake-audio-capture=${process.env.RUNNER_TEMP}/consumer-loop.wav`,
              '--autoplay-policy=no-user-gesture-required',
            ],
          });
          const page = await browser.newPage();
          const pageErrors = [];
          page.on('pageerror', error => pageErrors.push(error.message));

          await page.evaluateOnNewDocument(() => {
            window.__erContexts = [];
            window.__erStream = undefined;
            window.__erSourceStarts = 0;
            window.__erSourceStops = 0;

            const OriginalAudioContext = window.AudioContext;
            window.AudioContext = new Proxy(OriginalAudioContext, {
              construct(target, args, newTarget) {
                const context = Reflect.construct(target, args, newTarget);
                window.__erContexts.push(context);
                return context;
              },
            });

            const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
            navigator.mediaDevices.getUserMedia = async (...args) => {
              const stream = await originalGetUserMedia(...args);
              window.__erStream = stream;
              return stream;
            };

            const originalStart = AudioBufferSourceNode.prototype.start;
            const originalStop = AudioBufferSourceNode.prototype.stop;
            AudioBufferSourceNode.prototype.start = function (...args) {
              window.__erSourceStarts += 1;
              return originalStart.apply(this, args);
            };
            AudioBufferSourceNode.prototype.stop = function (...args) {
              window.__erSourceStops += 1;
              return originalStop.apply(this, args);
            };
          });

          async function clickButton(label) {
            await page.evaluate(text => {
              const match = [...document.querySelectorAll('button')].find(node => node.textContent?.trim() === text);
              if (!(match instanceof HTMLButtonElement) || match.disabled) throw new Error(`${text} unavailable`);
              match.click();
            }, label);
          }

          try {
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle0', timeout: 30_000 });
            await clickButton('START LISTENING');
            await page.waitForFunction(
              () => document.body.innerText.includes('We estimated 3 audible resonances.'),
              { timeout: 15_000, polling: 100 },
            );

            const initial = await page.evaluate(() => ({
              contexts: window.__erContexts.length,
              dna: document.querySelector('.dna-view') !== null,
              streamPresent: window.__erStream instanceof MediaStream,
            }));
            if (initial.contexts !== 1 || !initial.dna || !initial.streamPresent) {
              throw new Error(`runtime instrumentation failed: ${JSON.stringify(initial)}`);
            }

            const suspendedBeforeOriginal = await page.evaluate(async () => {
              const context = window.__erContexts[0];
              await context.suspend();
              return context.state;
            });
            if (suspendedBeforeOriginal !== 'suspended') throw new Error(`could not suspend context: ${suspendedBeforeOriginal}`);

            await clickButton('HEAR ORIGINAL');
            await page.waitForFunction(() => window.__erContexts[0]?.state === 'running' && window.__erSourceStarts >= 1, { timeout: 3_000, polling: 50 });
            const afterOriginal = await page.evaluate(() => ({ starts: window.__erSourceStarts, stops: window.__erSourceStops }));
            if (afterOriginal.starts !== 1 || afterOriginal.stops !== 0) throw new Error(`unexpected first playback counts: ${JSON.stringify(afterOriginal)}`);

            await clickButton('HEAR RECONSTRUCTION');
            await page.waitForFunction(() => window.__erSourceStarts >= 2 && window.__erSourceStops >= 1, { timeout: 3_000, polling: 50 });
            const afterReplacement = await page.evaluate(() => ({ starts: window.__erSourceStarts, stops: window.__erSourceStops }));
            if (afterReplacement.starts !== 2 || afterReplacement.stops < 1) {
              throw new Error(`sample playback was not exclusive: ${JSON.stringify(afterReplacement)}`);
            }

            await page.waitForFunction(() => {
              const match = [...document.querySelectorAll('button')].find(node => node.textContent?.trim() === 'PLAY IT');
              return match instanceof HTMLButtonElement && !match.disabled;
            }, { timeout: 5_000, polling: 100 });
            await clickButton('PLAY IT');

            const suspendedBeforeNote = await page.evaluate(async () => {
              const context = window.__erContexts[0];
              await context.suspend();
              return context.state;
            });
            if (suspendedBeforeNote !== 'suspended') throw new Error('context did not suspend before note');
            await page.$eval('.consumer-keyboard button[aria-label="C4"]', node => {
              node.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerType: 'mouse' }));
            });
            await page.waitForFunction(() => window.__erContexts[0]?.state === 'running', { timeout: 3_000, polling: 50 });

            await page.evaluate(() => {
              const track = window.__erStream?.getAudioTracks()[0];
              if (track === undefined) throw new Error('active microphone track missing');
              track.stop();
              track.dispatchEvent(new Event('ended'));
            });
            const disconnectedCopy = 'The microphone disconnected. Reconnect or reselect the input, then start again.';
            await page.waitForFunction(text => document.body.innerText.includes(text), { timeout: 3_000, polling: 50 }, disconnectedCopy);
            const terminal = await page.evaluate(() => ({
              text: document.body.innerText,
              contextState: window.__erContexts[0]?.state,
              trackState: window.__erStream?.getAudioTracks()[0]?.readyState,
            }));
            if (!terminal.text.includes('TRY AGAIN') || !terminal.text.includes('START OVER')) throw new Error('disconnect recovery actions missing');
            if (terminal.contextState !== 'closed') throw new Error(`audio context remained live after input loss: ${terminal.contextState}`);
            if (terminal.trackState !== 'ended') throw new Error(`microphone track did not end: ${terminal.trackState}`);
            if (pageErrors.length > 0) throw new Error(pageErrors.join('\n'));

            const report = {
              targetRevision: process.env.TARGET_REVISION,
              suspendedSamplePlaybackResumed: true,
              originalToReconstructionExclusive: true,
              replacementStopCount: afterReplacement.stops,
              suspendedInstrumentResumed: true,
              microphoneDisconnectRecovered: true,
              audioContextClosedOnDisconnect: true,
              pageErrors: 0,
            };
            console.log(JSON.stringify(report, null, 2));
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/consumer-e2e-report.json`, JSON.stringify(report, null, 2));
          } finally {
            await browser.close();
          }
          JS
          CHROME="${CHROME}" RUNNER_TEMP="${RUNNER_TEMP}" TARGET_REVISION="${TARGET_REVISION}" node "${RUNNER_TEMP}/consumer-e2e/test.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-e2e
          path: |
            ${{ runner.temp }}/consumer-e2e-report.json
            ${{ runner.temp }}/consumer-vite.log
          if-no-files-found: ignore
