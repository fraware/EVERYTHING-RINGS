name: apply-microphone-errors

on:
  push:
    branches: [post-freeze-permission-errors]
    paths: [.github/workflows/apply-microphone-errors.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: post-freeze-permission-errors
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded startup mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/useStrikeSession.ts')
          text = path.read_text()
          old_import = 'import { ensureAudioContextRunning } from "./audioContext";\n'
          new_import = old_import + 'import { normalizeMicrophoneStartupFailure } from "./microphoneError";\n'
          if text.count(old_import) != 1:
            raise SystemExit(f'import anchor count {text.count(old_import)}')
          text = text.replace(old_import, new_import)

          old = '''      if (resources.current === undefined) {
        openingGraph?.disconnect();
        openingWorker?.terminate();
        openingMicrophone?.stream.getTracks().forEach((track) => track.stop());
        if (openingContext !== undefined) void openingContext.close();
      }
      setFailureReason(error instanceof Error ? error.message : String(error));
      setState("error");
'''
          new = '''      if (resources.current === undefined) {
        openingGraph?.disconnect();
        openingWorker?.terminate();
        openingMicrophone?.stream.getTracks().forEach((track) => track.stop());
        if (openingContext !== undefined) void openingContext.close();
      }
      setFailureReason(normalizeMicrophoneStartupFailure(error));
      setState("error");
'''
          if text.count(old) != 1:
            raise SystemExit(f'startup catch anchor count {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: bash scripts/browser-smoke.sh
      - name: Commit verified changes
        run: |
          rm .github/workflows/apply-microphone-errors.yml
          git add -A
          git diff --cached --check
          git config user.name "repository-maintenance"
          git config user.email "repository-maintenance@users.noreply.github.com"
          git commit -m "Normalize microphone startup failures"
          git push origin HEAD:post-freeze-permission-errors
